[package]
name = "netidentity"
version = "0.1.0"
edition = "2021"
authors = ["r3dg0d"]
license = "MIT"
description = "Network identity snapshot — capture, compare, and report local network identity"
readme = "README.md"
repository = "https://github.com/r3dg0d/netidentity"
keywords = ["network", "privacy", "identity", "cli", "snapshot"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.75"

[[bin]]
name = "netidentity"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ctrlc = "3"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
